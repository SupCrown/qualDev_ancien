image:
  name: rust:1.83.0-bookworm

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

test-palindrome:
  stage: test
  script:
    - echo "Testing simulation"
    - cd Social_simulation_base_egui
    - cargo test
